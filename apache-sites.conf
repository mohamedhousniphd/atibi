ServerName atibiazzeddine.com
SetEnvIf X-Forwarded-Proto "https" HTTPS=on

<Directory /var/www>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# 1. Default & atibiazzeddine.com
<VirtualHost *:80>
    ServerName atibiazzeddine.com
    ServerAlias www.atibiazzeddine.com
    DocumentRoot /var/www/atibi
    DirectoryIndex index.html
</VirtualHost>

# 2. chimiolab.atibiazzeddine.com
<VirtualHost *:80>
    ServerName chimiolab.atibiazzeddine.com
    DocumentRoot /var/www/chimiolab
    DirectoryIndex index.html
</VirtualHost>

# 3. chimie-lab.atibiazzeddine.com
<VirtualHost *:80>
    ServerName chimie-lab.atibiazzeddine.com
    DocumentRoot /var/www/chimie-lab
    DirectoryIndex index.html
    <Directory /var/www/chimie-lab>
        FallbackResource /index.html
    </Directory>
</VirtualHost>

# 4. chimie360.atibiazzeddine.com
<VirtualHost *:80>
    ServerName chimie360.atibiazzeddine.com
    DocumentRoot /var/www/chimie360
    DirectoryIndex index.html
</VirtualHost>

# 5. pc3d.atibiazzeddine.com
<VirtualHost *:80>
    ServerName pc3d.atibiazzeddine.com
    DocumentRoot /var/www/pc3d
    DirectoryIndex index.html
</VirtualHost>

# 6. securilab.atibiazzeddine.com
<VirtualHost *:80>
    ServerName securilab.atibiazzeddine.com
    DocumentRoot /var/www/securilab
    DirectoryIndex index.html
    <Directory /var/www/securilab>
        FallbackResource /index.html
    </Directory>
</VirtualHost>

# 7. tp-planner.atibiazzeddine.com
<VirtualHost *:80>
    ServerName tp-planner.atibiazzeddine.com
    DocumentRoot /var/www/tp-planner
    DirectoryIndex index.php index.html
    <Directory /var/www/tp-planner>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
