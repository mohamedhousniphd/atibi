<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 50" width="220" height="50">
  <!-- Brand Icon -->
  <g transform="translate(5, 5)">
    <!-- Outer atom ring -->
    <ellipse cx="20" cy="20" rx="18" ry="6" fill="none" stroke="#6C63FF" stroke-width="2" transform="rotate(30 20 20)" opacity="0.7"/>
    <ellipse cx="20" cy="20" rx="18" ry="6" fill="none" stroke="#6C63FF" stroke-width="2" transform="rotate(-30 20 20)" opacity="0.7"/>
    <!-- Nucleus / Molecule junction -->
    <circle cx="20" cy="20" r="5" fill="#3F3D56" />
    <circle cx="9" cy="14" r="3" fill="#6C63FF" />
    <circle cx="31" cy="26" r="3" fill="#6C63FF" />
    <circle cx="12" cy="28" r="2.5" fill="#3F3D56" />
    <circle cx="28" cy="10" r="2.5" fill="#3F3D56" />
    <!-- Bonds connecting nodes -->
    <line x1="20" y1="20" x2="9" y2="14" stroke="#3F3D56" stroke-width="1.5" />
    <line x1="20" y1="20" x2="31" y2="26" stroke="#3F3D56" stroke-width="1.5" />
  </g>
  <!-- Text -->
  <text x="55" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#2D3748">Pr. ATIBI</text>
  <text x="150" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="300" fill="#6C63FF">AZZEDDINE</text>
</svg>
