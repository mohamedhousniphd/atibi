@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0a0e14;--bg2:#131920;--bg3:#1a2230;--bg4:#243040;
  --text:#e6edf3;--text2:#8b949e;--accent:#4dabf7;
  --green:#2dc653;--red:#e63946;--orange:#f77f00;
  --cyan:#00b4d8;--violet:#9b5de5;--pink:#ff69b4;
  --yellow:#ffd60a;--gold:#deb887;
  --panel:#111820;--border:#2a3545;--radius:10px;
}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);}
body{overflow-x:hidden;}

#topNav{position:fixed;top:0;left:0;right:0;height:52px;background:linear-gradient(180deg,var(--bg2),var(--bg));border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 10px;z-index:1000;gap:3px;overflow-x:auto;}
.nb{padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg3);color:var(--text2);cursor:pointer;font-family:'Outfit',sans-serif;font-size:11px;font-weight:500;white-space:nowrap;transition:all .2s;display:flex;align-items:center;gap:3px;flex-shrink:0;}
.nb:hover:not(.lk){background:var(--bg4);color:var(--text);}
.nb.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.nb.lk{opacity:.4;cursor:not-allowed;}

#main{position:fixed;top:52px;left:0;right:0;bottom:0;display:flex;}
#cv{flex:1;position:relative;min-width:0;background:var(--bg);}
#sp{width:380px;min-width:380px;background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;}
#sp>*{flex-shrink:0;}

#chrono{position:absolute;top:14px;left:14px;background:rgba(8,12,20,.82);border:1px solid var(--border);border-radius:var(--radius);padding:8px 14px;font-family:'JetBrains Mono',monospace;font-size:15px;color:var(--cyan);z-index:50;display:none;}
#chrono.show{display:block;}

.pt{font-size:15px;font-weight:700;color:var(--accent);padding-bottom:8px;border-bottom:1px solid var(--border);font-family:'JetBrains Mono',monospace;line-height:1.35;}
.bx{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:12px;font-size:13px;line-height:1.55;}
.bx h3{font-size:11px;font-weight:600;margin-bottom:8px;color:var(--accent);text-transform:uppercase;letter-spacing:1px;}
.eq{font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:8px 10px;margin:6px 0;color:var(--gold);text-align:center;}
.q{font-weight:700;color:var(--text);font-size:14px;line-height:1.5;}

.btn{padding:10px 14px;border:none;border-radius:var(--radius);font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;justify-content:center;min-height:42px;}
.bp{background:var(--accent);color:#fff;}.bp:hover:not(:disabled){background:#3a8fd4;}
.bo{background:transparent;border:1px solid var(--border);color:var(--text2);}.bo:hover:not(:disabled){border-color:var(--accent);color:var(--text);}
.bs{background:var(--green);color:#04210f;}.bs:hover:not(:disabled){background:#27b04a;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.bg{display:flex;flex-direction:column;gap:8px;}

.fb{padding:12px;border-radius:var(--radius);font-size:13px;line-height:1.6;display:none;animation:fi .3s;}
.fb.show{display:block;}
.fb.ok{background:rgba(45,198,83,.12);border:1px solid var(--green);color:#6ee89a;}
.fb.inf{background:rgba(77,171,247,.12);border:1px solid var(--accent);color:#7dc4ff;}
.fb.wrn{background:rgba(247,127,0,.12);border:1px solid var(--orange);color:#ffaa44;}

.reveal{background:linear-gradient(135deg,#14202e,#182840);border:1px solid var(--accent);border-radius:var(--radius);padding:14px;position:relative;overflow:hidden;display:none;animation:fi .5s;font-size:13px;line-height:1.6;}
.reveal.show{display:block;}
.reveal::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--cyan));}

.step{display:flex;gap:8px;align-items:flex-start;font-size:12px;padding:6px 0;color:var(--text2);}
.step .dot{width:18px;height:18px;border-radius:50%;border:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;}
.step.done{color:var(--text);}.step.done .dot{background:var(--green);border-color:var(--green);color:#04210f;}

.mo{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.78);z-index:2000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);padding:20px;}
.mo.show{display:flex;}
.md{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:26px;max-width:540px;width:100%;max-height:88vh;overflow-y:auto;}
.md h2{font-size:18px;margin-bottom:14px;color:var(--accent);}
.md p{font-size:13px;line-height:1.6;color:var(--text2);margin-bottom:8px;}

@keyframes fi{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:768px){#main{flex-direction:column;}#sp{width:100%;min-width:0;max-height:48vh;border-left:none;border-top:1px solid var(--border);}#cv{min-height:40vh;}}
#sp::-webkit-scrollbar{width:5px;}#sp::-webkit-scrollbar-track{background:var(--bg);}#sp::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
</style>
</head>

<script>
/* ================================================================
   ÉTAT GLOBAL
   ================================================================ */
var S = {
  sc:null, ca:null, re:null, ct:null,
  cur:0,                 // scène courante
  anim:false,            // animationInProgress (mutex)
  running:false,         // simulationRunning
  pending:null,          // pendingScene
  timers:[],             // activeTimers
  grp:null,              // groupe de la scène courante
  live:null,             // callback d'animation par frame
  unlocked:[0,1,2],
  // refs scènes
  d:{}
};

/* ================================================================
   THREE.JS — INIT + BOUCLE RAF UNIQUE
   ================================================================ */
function initT(){
  var w=document.getElementById('cv');
  S.sc=new THREE.Scene(); S.sc.background=new THREE.Color(0x0a0e14);
  S.ca=new THREE.PerspectiveCamera(50,w.clientWidth/w.clientHeight,.1,200);
  S.ca.position.set(0,2,8);
  S.re=new THREE.WebGLRenderer({antialias:true});
  S.re.setSize(w.clientWidth,w.clientHeight);
  S.re.setPixelRatio(Math.min(window.devicePixelRatio,2));
  w.appendChild(S.re.domElement);
  S.ct=new THREE.OrbitControls(S.ca,S.re.domElement);
  S.ct.enableDamping=true; S.ct.dampingFactor=.08;
  S.ct.minDistance=2; S.ct.maxDistance=40;
  S.sc.add(new THREE.HemisphereLight(0xfff5e6,0x080820,.85));
  var d1=new THREE.DirectionalLight(0x4dabf7,.5); d1.position.set(-5,6,4); S.sc.add(d1);
  var d2=new THREE.DirectionalLight(0xffaa00,.35); d2.position.set(5,3,-2); S.sc.add(d2);
  S.sc.add(new THREE.AmbientLight(0x222244,.35));
  window.addEventListener('resize',onResize);
  (function loop(){
    requestAnimationFrame(loop);
    if(!S.re) return;
    S.ct.update();
    S.sc.traverse(function(c){ if(c.userData&&c.userData.bb) c.quaternion.copy(S.ca.quaternion); });
    if(S.live) S.live();
    S.re.render(S.sc,S.ca);
  })();
}
function onResize(){
  if(!S.re) return;
  var w=document.getElementById('cv');
  S.ca.aspect=w.clientWidth/w.clientHeight; S.ca.updateProjectionMatrix();
  S.re.setSize(w.clientWidth,w.clientHeight);
}
function setCam(px,py,pz,tx,ty,tz){
  S.ca.position.set(px,py,pz); S.ct.target.set(tx,ty,tz); S.ct.update();
}

/* ================================================================
   UTILITAIRES 3D
   ================================================================ */
function mkSphere(r,col,o){
  o=o||{}; var hasOpa=o.opa!==undefined;
  var g=new THREE.SphereGeometry(r,o.seg||24,o.seg||24);
  var m=new THREE.MeshStandardMaterial({color:col,metalness:o.met||.1,roughness:o.rou||.35,
    transparent:hasOpa,opacity:hasOpa?o.opa:1,side:o.ds?THREE.DoubleSide:THREE.FrontSide,
    depthWrite:hasOpa?false:true,emissive:o.em||0,emissiveIntensity:o.emi||0});
  var ms=new THREE.Mesh(g,m); if(o.pos)ms.position.copy(o.pos);
  if(o.ro!==undefined)ms.renderOrder=o.ro; return ms;
}
function mkCyl(rT,rB,h,col,o){
  o=o||{}; var hasOpa=o.opa!==undefined;
  var g=new THREE.CylinderGeometry(rT,rB,h,o.seg||24,1,!!o.open);
  var m=new THREE.MeshStandardMaterial({color:col,metalness:o.met||.1,roughness:o.rou||.4,
    transparent:hasOpa,opacity:hasOpa?o.opa:1,side:o.ds?THREE.DoubleSide:THREE.FrontSide,
    depthWrite:hasOpa?false:true,emissive:o.em||0,emissiveIntensity:o.emi||0});
  var ms=new THREE.Mesh(g,m); if(o.ro!==undefined)ms.renderOrder=o.ro; return ms;
}
function mkBox(w,h,d,col,o){
  o=o||{}; var hasOpa=o.opa!==undefined;
  var g=new THREE.BoxGeometry(w,h,d);
  var m=new THREE.MeshStandardMaterial({color:col,metalness:o.met||.1,roughness:o.rou||.5,
    transparent:hasOpa,opacity:hasOpa?o.opa:1,depthWrite:hasOpa?false:true});
  return new THREE.Mesh(g,m);
}
function mL(t,sz,cl){
  cl=cl||'#ffffff'; var cv=document.createElement('canvas'); cv.width=256; cv.height=64;
  var cx=cv.getContext('2d'); cx.clearRect(0,0,256,64);
  var fs=Math.min(48,Math.floor(230/Math.max(t.length,1)*1.9));
  cx.font='bold '+fs+'px Outfit,Arial,sans-serif';
  cx.textAlign='center'; cx.textBaseline='middle'; cx.fillStyle=cl; cx.fillText(t,128,34);
  var tx=new THREE.CanvasTexture(cv); tx.minFilter=THREE.LinearFilter;
  var sm=new THREE.SpriteMaterial({map:tx,transparent:true,depthTest:false});
  var sp=new THREE.Sprite(sm); sp.scale.set(sz*4,sz,1); sp.userData={bb:true};
  sp.renderOrder=999; return sp;
}
function addL(parent,t,sz,cl,x,y,z){ var l=mL(t,sz,cl); l.position.set(x,y,z); parent.add(l); return l; }

/* Verre de bécher transparent (depthWrite:false + renderOrder) */
function mkBeaker(rT,rB,h){
  var g=new THREE.CylinderGeometry(rT,rB,h,32,1,true);
  var m=new THREE.MeshPhysicalMaterial({color:0xbfe9ff,metalness:0,roughness:.05,
    transparent:true,opacity:.16,side:THREE.DoubleSide,depthWrite:false,
    transmission:.6,clearcoat:1});
  var ms=new THREE.Mesh(g,m); ms.renderOrder=2; return ms;
}

/* ================================================================
   DISPOSE / NETTOYAGE
   ================================================================ */
function disposeObj(o){
  if(o.geometry) o.geometry.dispose();
  if(o.material){
    var ms=Array.isArray(o.material)?o.material:[o.material];
    ms.forEach(function(m){ if(m.map)m.map.dispose(); m.dispose(); });
  }
}
function disposeGroup(g){
  if(!g) return;
  g.traverse(function(c){ if(c.isMesh||c.isSprite) disposeObj(c); });
  if(g.parent) g.parent.remove(g);
}
function clearTimers(){ for(var i=0;i<S.timers.length;i++) clearInterval(S.timers[i]); S.timers=[]; }
function addTimer(fn,ms){ var id=setInterval(fn,ms); S.timers.push(id); return id; }

/* ================================================================
   MUTEX + TWEEN
   ================================================================ */
function easeIO(t){ return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; }
function tween(dur,onU,onD){
  return new Promise(function(res){
    var t0=performance.now();
    (function step(){
      var t=Math.min(1,(performance.now()-t0)/dur);
      onU(easeIO(t),t);
      if(t<1){ requestAnimationFrame(step); }
      else { if(onD)onD(); res(); }
    })();
  });
}
function runAnim(btn,fn){
  if(S.anim) return;
  S.anim=true; if(btn)btn.disabled=true;
  Promise.resolve().then(fn).catch(function(e){console.error(e);}).finally(function(){
    S.anim=false;
    if(S.pending!==null){ var n=S.pending; S.pending=null; go(n); }
  });
}
function sFB(id,tp,msg){ var f=document.getElementById(id); if(!f)return; f.className='fb show '+tp; f.innerHTML=msg; }

/* ================================================================
   NAVIGATION
   ================================================================ */
var SCENES={};
function go(n){
  if(n===S.cur) return;
  if(S.unlocked.indexOf(n)<0) return;
  if(S.anim){ S.pending=n; return; }
  // destroy courant
  S.running=false; clearTimers(); S.live=null;
  if(SCENES[S.cur]&&SCENES[S.cur].destroy) SCENES[S.cur].destroy();
  disposeGroup(S.grp); S.grp=null; S.d={};
  S.cur=n;
  document.querySelectorAll('.nb').forEach(function(b){ b.classList.toggle('on',+b.dataset.s===n); });
  S.grp=new THREE.Group(); S.sc.add(S.grp);
  document.getElementById('chrono').classList.remove('show');
  if(SCENES[n]&&SCENES[n].init) SCENES[n].init();
}
function unlock(n){
  if(S.unlocked.indexOf(n)<0){
    S.unlocked.push(n);
    var b=document.querySelector('.nb[data-s="'+n+'"]');
    if(b){ b.classList.remove('lk'); b.textContent=b.textContent.replace('🔒 ',''); }
  }
}
function nextBtn(n){
  return '<button class="btn bs" id="nextB" onclick="go('+n+')" disabled>Suivant ⏭</button>';
}
function enableNext(){ var b=document.getElementById('nextB'); if(b)b.disabled=false; }
function chrono(txt){ var c=document.getElementById('chrono'); c.classList.add('show'); c.textContent=txt; }

/* ================================================================
   SCÈNE 1 — LE CANON D'ESSAOUIRA & LES FEUX D'ARTIFICE
   ================================================================ */
SCENES[0]={
  init:function(){
    setCam(0,2,8, 0,1,0);
    S.d.fwDone=false; S.d.canonDone=false;
    // Étoiles
    var stars=new THREE.Group(); S.grp.add(stars);
    for(var i=0;i<90;i++){
      var st=mkSphere(.018+Math.random()*.02,0xffffff,{em:0xffffff,emi:.8,seg:6});
      st.position.set((Math.random()-.5)*16,(Math.random()*5)+1,-3-Math.random()*4);
      stars.add(st);
    }
    // --- FEU D'ARTIFICE (gauche) : amas dormant + particules ---
    var fw=new THREE.Group(); fw.position.set(-3.2,2.6,0); S.grp.add(fw);

function fireworkAnim(){

      p.position.copy(p.userData.dir).multiplyScalar(e*spread);

function setSceneCu(){

  S.d.halo.material.opacity=0;
  for(var i=0;i<2;i++){ S.d.elec[i].userData.active=false; S.d.elec[i].position.set(99,99,99); }
}
function setSceneIon(){
  S.d.state='ion';
  S.d.sph.material.color.set(0x2980b9); S.d.sph.scale.setScalar(.64);

  var nl=mL('Cu²⁺',.42,'#5dade2'); S.d.lbl.material=nl.material;

  for(var i=0;i<2;i++){ S.d.elec[i].userData.active=true; }

function reductionAnim(){
  if(S.d.state==='cu') setSceneIon(); // partir de l'ion pour montrer le gain
  // électrons rejoignent l'ion → devient Cu
  return tween(2400,function(e){
    var col=new THREE.Color(0x2980b9).lerp(new THREE.Color(0xb87333),e);
    S.d.sph.material.color.copy(col);
    S.d.sph.scale.setScalar(.64+.36*e);
    S.d.halo.material.opacity=.45*(1-e);
    for(var i=0;i<2;i++){
      var el=S.d.elec[i];
      var a=S.d.t+el.userData.ang;
      var r=2.0*(1-e);
      el.position.set(Math.cos(a)*r,Math.sin(a*1.3)*.5*(1-e),Math.sin(a)*r);

  });

function oxydationAnim(){
  if(S.d.state==='ion') setSceneCu(); // partir de l'atome pour montrer la perte

      var el=S.d.elec[i];

  },function(){

    sFB('fb1','wrn','<b>OXYDATION = PERTE d\'électrons.</b><br>Cu → Cu²⁺ + 2e⁻. L\'atome Cu est <b>oxydé</b>.');

function buildEquation(){
  S.d.eqStep=0;
  var steps=[
    {h:'Étape 1 — Équilibrer les électrons',p:'Cu libère <b>2 e⁻</b>, mais Ag⁺ n\'en capte qu\'<b>1</b>. On multiplie la 2ᵉ demi-équation par 2 :',e:['Cu(s) → Cu²⁺(aq) + 2e⁻','2 Ag⁺(aq) + 2e⁻ → 2 Ag(s)']},
    {h:'Étape 2 — Additionner',p:'On additionne les deux demi-équations :',e:['Cu(s) + 2Ag⁺(aq) + 2e⁻ → Cu²⁺(aq) + 2Ag(s) + 2e⁻']},
    {h:'Étape 3 — Simplifier',p:'Les <b>2 e⁻</b> apparaissent des deux côtés : on les simplifie. Équation bilan :',e:['Cu(s) + 2 Ag⁺(aq) → Cu²⁺(aq) + 2 Ag(s)']}
  ];
  function render(){
    var s=steps[S.d.eqStep];
    var eqs=s.e.map(function(x){return '<div class="eq">'+x+'</div>';}).join('');
    var last=S.d.eqStep===steps.length-1;
    openModal('<h2>'+s.h+'</h2><p>'+s.p+'</p>'+eqs+
      '<div class="bg" style="margin-top:16px">'+
      (last?'<button class="btn bs" id="mNext">✓ Terminer</button>':'<button class="btn bp" id="mNext">Étape suivante →</button>')+
      '</div>');
    document.getElementById('st'+S.d.eqStep).classList.add('done');

      if(last){ finishBuild(); }
      else { S.d.eqStep++; render(); }

  },function(){

  });

function mkTube(rad,h){
  // éprouvette : tube ouvert + fond arrondi
  var g=new THREE.Group();
  var body=mkCyl(rad,rad,h,0xcfeaff,{opa:.14,seg:24,ds:true}); body.renderOrder=2; g.add(body);
  var bottom=mkSphere(rad,0xcfeaff,{opa:.14,seg:20,ds:true}); bottom.scale.y=.6; bottom.position.y=-h/2; bottom.renderOrder=2; g.add(bottom);
  return g;
}
function glow(obj,on,col){
  if(!obj||!obj.material) return;
  obj.material.emissive.set(on?(col||0x00b4d8):0x000000);
  obj.material.emissiveIntensity=on?.6:0;
}

function startLente(btn){
  if(S.running||S.d.startedOnce) return;
  S.d.startedOnce=true; btn.disabled=true; S.running=true;
  chrono('⏱ 0 s');
  // tilt rapide de l'éprouvette
  tween(700,function(e){ S.d.tube.rotation.z=.15+e*1.5; },function(){ S.d.tube.rotation.z=.15; });
  var clear=new THREE.Color(0xeef6f8), turbid=new THREE.Color(0xf5f0d0);
  var t0=performance.now();
  addTimer(function(){
    if(!S.running) return;
    var inc=(0.1/30)*100*S.d.speed; // 30 s simulés à 1×
    S.d.turb=Math.min(100,S.d.turb+inc);
    var f=S.d.turb/100;
    if(S.d.sol){ S.d.sol.material.color.copy(clear).lerp(turbid,f); S.d.sol.material.opacity=.06+.62*f; }
    var bar=document.getElementById('turbBar'), txt=document.getElementById('turbTxt');
    if(bar)bar.style.width=S.d.turb.toFixed(0)+'%';
    if(txt)txt.textContent=S.d.turb.toFixed(0)+' %';
    // soufre : densité croissante
    var kids=S.d.sulf?S.d.sulf.children:[];
    for(var i=0;i<kids.length;i++){ var thr=i/kids.length; var g=Math.max(0,Math.min(1,(f-thr)/.25));
      kids[i].material.opacity=g*.9; kids[i].scale.setScalar(kids[i].userData.s0*g); }
    chrono('⏱ '+Math.round((S.d.turb/100)*60)+' s (simulé)');
    if(S.d.turb>=100){
      S.running=false; clearTimers();
      sFB('fb4','inf','Le soufre <b>S(s)</b> se forme progressivement → solution <b>blanc-jaunâtre trouble</b>. Transformation <b>LENTE</b> : suivable À L\'ŒIL sur plusieurs minutes.');
      done(5);
    }
  },100);
}

function markSeen(k){ S.d.seen=S.d.seen||{}; S.d.seen[k]=true; if(S.d.seen.r&&S.d.seen.l&&S.d.seen.i) done(6); }
function syntheseEau(){
  // flacon avec H2 + O2, stable, puis explosion
  var fl=new THREE.Group(); fl.position.set(-1.6,1.5,1.2); S.grp.add(fl);
  var glass=mkBeaker(.45,.4,1.0); fl.add(glass);
  var mol=[];
  for(var i=0;i<24;i++){ var col=i%3===0?0xe63946:0xeeeeee; var m=mkSphere(.07,col,{em:col,emi:.25,seg:8});
    m.position.set((Math.random()-.5)*.6,(Math.random()-.4)*.8,(Math.random()-.5)*.6); m.userData.d=new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize(); fl.add(m); mol.push(m); }
  return tween(2600,function(e,raw){
    if(raw<.55){ /* stable : léger frémissement */ for(var i=0;i<mol.length;i++){ mol[i].position.addScaledVector(mol[i].userData.d,.002); } }
    else { var k=(raw-.55)/.45; for(var i=0;i<mol.length;i++){ mol[i].position.addScaledVector(mol[i].userData.d,.05*k); mol[i].material.emissiveIntensity=.25+k*2; mol[i].material.opacity=Math.max(0,1-k); mol[i].material.transparent=true; } }
  },function(){
    disposeGroup(fl);
    sFB('fb5b','wrn','<b>2H₂(g) + O₂(g) → 2H₂O(l).</b> Le mélange est STABLE à température ambiante (infiniment lente), mais une flamme / mousse de platine déclenche une <b>explosion</b> (rapide).');
  });
}
function eauOxygenee(){

  var amb=mkCyl(.34,.3,.9,0x6b4226,{opa:.85,seg:20}); opaque.add(amb);

  for(var i=0;i<14;i++){ var bb=mkSphere(.04,0xffffff,{opa:.7,em:0xffffff,emi:.4,seg:8}); bb.position.set((Math.random()-.5)*.4,-.4,(Math.random()-.5)*.4); bb.userData.sp=.4+Math.random()*.6; clear.add(bb); bubbles.push(bb); }
  return tween(2800,function(e,raw){

  },function(){
    disposeGroup(clear); disposeGroup(opaque);

  });
}

function mkThermo(parent,x,y,val){
  var g=new THREE.Group(); g.position.set(x,y,0);
  var tube=mkCyl(.05,.05,.7,0xffffff,{opa:.3,seg:12}); g.add(tube);
  var bulb=mkSphere(.09,0xe63946,{em:0xe63946,emi:.3,seg:12}); bulb.position.y=-.38; g.add(bulb);
  var col=mkCyl(.025,.025,.5,0xe63946,{seg:8}); col.position.y=-.1; g.add(col);
  addL(g,val.toFixed(1)+'°C',.2,'#ff8a94',0,.5,0);
  parent.add(g); return g;
}
/* moteur de brunissement parallèle (béchers à vitesses différentes) */
function startParallel(items,onTick,onAllDone){
  // items: [{mat, rate, prog:0}]
  if(S.running) return; S.running=true;
  var brown=new THREE.Color(0xb8860b), clear=new THREE.Color(0xeef4f8);
  addTimer(function(){
    if(!S.running) return;
    var all=true;
    for(var i=0;i<items.length;i++){
      var it=items[i];
      it.prog=Math.min(1,it.prog+(0.02*it.rate*(S.d.speed||1)));
      it.mat.color.copy(clear).lerp(brown,it.prog);
      it.mat.opacity=.3+.45*it.prog;
      if(it.prog<1) all=false;
    }
    if(onTick)onTick(items);
    if(all){ S.running=false; clearTimers(); if(onAllDone)onAllDone(); }
  },100);
}

var QUIZ=[
  {q:'Un oxydant est une espèce chimique capable de :',o:['Perdre un ou plusieurs électrons','Gagner un ou plusieurs électrons','Ne jamais réagir','Se dissoudre dans l\'eau'],a:1},
  {q:'Une transformation RAPIDE :',o:['Dure plusieurs heures','Se déroule en un temps très court, non suivable à l\'œil','Nécessite un catalyseur','Ne se produit jamais'],a:1},
  {q:'Pour suivre une transformation qui dégage un gaz, on peut mesurer :',o:['Le pH uniquement','La couleur uniquement','Le volume, la pression, ou la masse','La conductivité uniquement'],a:2},
  {q:'Quand on augmente la concentration initiale d\'un réactif, la vitesse :',o:['Diminue','Ne change pas','Augmente','S\'annule'],a:2},
  {q:'Pour conserver des aliments plus longtemps, on les met au froid car :',o:['Le froid accélère les réactions de décomposition','Le froid ralentit les réactions de décomposition','Le froid arrête définitivement toute réaction','La température n\'a aucun effet'],a:1}
];
function startQuiz(){ S.d.qi=0; S.d.qscore=0; renderQuiz(); }
function renderQuiz(){
  var item=QUIZ[S.d.qi];
  var opts=item.o.map(function(t,i){ return '<button class="btn bo" data-i="'+i+'" style="text-align:left;width:100%">'+String.fromCharCode(65+i)+'. '+t+'</button>'; }).join('');
  openModal('<h2>Quiz — Question '+(S.d.qi+1)+'/5</h2><p class="q" style="color:var(--text)">'+item.q+'</p><div class="bg" id="qOpts" style="margin-top:12px">'+opts+'</div><div class="fb" id="qfb" style="margin-top:12px"></div>');
  document.querySelectorAll('#qOpts button').forEach(function(b){
    b.onclick=function(){
      var i=+b.dataset.i;
      document.querySelectorAll('#qOpts button').forEach(function(x){x.disabled=true;});
      if(i===item.a){ S.d.qscore++; b.classList.remove('bo'); b.classList.add('bs'); sFB('qfb','ok','✓ Correct !'); }
      else { b.style.borderColor='var(--red)'; var good=document.querySelector('#qOpts button[data-i="'+item.a+'"]'); good.classList.remove('bo'); good.classList.add('bs'); sFB('qfb','wrn','✗ La bonne réponse est '+String.fromCharCode(65+item.a)+'.'); }
      setTimeout(function(){ S.d.qi++; if(S.d.qi<QUIZ.length)renderQuiz(); else showScore(); },1100);
    };
  });
}
function showScore(){
  var s=S.d.qscore, col=s===5?'#deb887':s===4?'#2dc653':'#f77f00';
  openModal('<h2>Résultat du Quiz</h2><div style="font-size:48px;font-weight:700;text-align:center;color:'+col+';padding:14px">'+s+' / 5</div>'+
    '<p style="text-align:center">'+(s===5?'Parfait ! 🎉':s>=4?'Très bien !':s>=3?'Pas mal, révise encore un peu.':'Reprends les scènes 1 à 9.')+'</p>'+
    '<div class="bg" style="margin-top:14px"><button class="btn bp" id="qAgain">↺ Recommencer le quiz</button><button class="btn bo" id="qClose">Fermer</button></div>');
  document.getElementById('qAgain').onclick=startQuiz;
  document.getElementById('qClose').onclick=closeModal;
}
